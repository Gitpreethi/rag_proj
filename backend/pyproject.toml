[project]
name = "india-earthquake-emergency-rag"
version = "0.1.0"
description = "India-specific post-earthquake emergency material demand prediction (RAG + reasoning LLM)"
#readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "config*", "database*", "rag*", "population_model*", "sources*", "data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
